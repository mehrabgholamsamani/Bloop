services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatroom
      POSTGRES_PASSWORD: chatroom
      POSTGRES_DB: chatroom
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatroom -d chatroom']
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://chatroom:chatroom@postgres:5432/chatroom?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in .env}
      PRIVATE_ROOM_PASSWORD_HASH: ${PRIVATE_ROOM_PASSWORD_HASH:-}
      PUBLIC_ORIGIN: http://127.0.0.1:5173
      SERVER_PORT: 3000
      AVATAR_UPLOAD_DIR: ./uploads/avatars
      # Local Compose uses plain HTTP; set production only behind HTTPS.
      NODE_ENV: development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/ready >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports: ['5173:80']
volumes:
  postgres_data:
